<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Doppler가 OFDM 부반송파에 만드는 변화</title>
  <desc id="desc">Doppler가 없을 때 FFT bin에 정확히 정렬되는 부반송파와 fractional Doppler로 에너지가 이웃 bin에 퍼져 ICI가 생기는 경우를 비교한다.</desc>
  <defs>
    <style>
      .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.title{font-size:58px;font-weight:700}.head{font-size:38px;font-weight:700}.body{font-size:28px}.small{font-size:23px}.axis{stroke:#374151;stroke-width:4}.grid{stroke:#d1d5db;stroke-width:2}.blue{stroke:#2563eb;fill:#2563eb}.red{stroke:#dc2626;fill:#dc2626}.muted{fill:#6b7280}.box{fill:#f9fafb;stroke:#d1d5db;stroke-width:3;rx:24}.arrow{stroke:#111827;stroke-width:5;fill:none;marker-end:url(#ah)}
    </style>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111827"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="1815" y="62" text-anchor="end" class="t small muted">개념도</text>
  <text x="960" y="92" text-anchor="middle" class="t title">Doppler가 OFDM 부반송파에 만드는 변화</text>

  <rect x="90" y="155" width="760" height="700" class="box"/>
  <rect x="1070" y="155" width="760" height="700" class="box"/>
  <text x="470" y="225" text-anchor="middle" class="t head">Doppler 없음</text>
  <text x="1450" y="225" text-anchor="middle" class="t head">Fractional Doppler 발생</text>

  <line x1="175" y1="700" x2="775" y2="700" class="axis"/>
  <line x1="175" y1="700" x2="175" y2="315" class="axis"/>
  <line x1="1155" y1="700" x2="1755" y2="700" class="axis"/>
  <line x1="1155" y1="700" x2="1155" y2="315" class="axis"/>

  <g class="grid">
    <line x1="255" y1="700" x2="255" y2="330"/><line x1="355" y1="700" x2="355" y2="330"/><line x1="455" y1="700" x2="455" y2="330"/><line x1="555" y1="700" x2="555" y2="330"/><line x1="655" y1="700" x2="655" y2="330"/>
    <line x1="1235" y1="700" x2="1235" y2="330"/><line x1="1335" y1="700" x2="1335" y2="330"/><line x1="1435" y1="700" x2="1435" y2="330"/><line x1="1535" y1="700" x2="1535" y2="330"/><line x1="1635" y1="700" x2="1635" y2="330"/>
  </g>

  <line x1="455" y1="700" x2="455" y2="350" class="blue" stroke-width="14"/>
  <circle cx="455" cy="350" r="12" class="blue"/>
  <text x="455" y="755" text-anchor="middle" class="t body">FFT bin k</text>
  <text x="470" y="815" text-anchor="middle" class="t body">주파수 격자와 정확히 정렬</text>

  <path d="M1235 675 C1280 650 1305 605 1335 555 C1360 510 1390 390 1468 355 C1540 405 1560 510 1585 565 C1615 625 1650 660 1690 680" fill="none" class="red" stroke-width="12"/>
  <line x1="1468" y1="700" x2="1468" y2="345" stroke="#dc2626" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="1435" y="755" text-anchor="middle" class="t body">bin k</text>
  <text x="1468" y="320" text-anchor="middle" class="t small red">k + ν</text>
  <text x="1450" y="815" text-anchor="middle" class="t body">에너지가 여러 FFT bin으로 확산</text>

  <path d="M850 505 L1060 505" class="arrow"/>
  <text x="955" y="465" text-anchor="middle" class="t body">Doppler ν</text>

  <rect x="250" y="900" width="1420" height="115" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="960" y="950" text-anchor="middle" class="t body">수신 부반송파가 FFT 기저와 어긋나면, 다른 부반송파 출력에도 성분이 나타난다.</text>
  <text x="960" y="992" text-anchor="middle" class="t head" fill="#dc2626">→ Inter-Carrier Interference (ICI)</text>
</svg>


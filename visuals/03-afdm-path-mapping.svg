<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Delay-Doppler 경로의 DAFT bin 매핑</title>
  <desc id="desc">서로 다른 delay와 Doppler를 갖는 세 경로가 chirp parameter c1을 통해 서로 다른 DAFT bin 위치로 이동하는 개념도다.</desc>
  <defs>
    <style>
      .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.title{font-size:58px;font-weight:700}.head{font-size:38px;font-weight:700}.body{font-size:28px}.small{font-size:22px}.axis{stroke:#374151;stroke-width:4}.grid{stroke:#d1d5db;stroke-width:2}.box{fill:#f9fafb;stroke:#d1d5db;stroke-width:3;rx:22}.blue{fill:#2563eb;stroke:#2563eb}.green{fill:#16a34a;stroke:#16a34a}.purple{fill:#9333ea;stroke:#9333ea}.arrow{fill:none;stroke-width:6;marker-end:url(#ah)}
    </style>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="1815" y="62" text-anchor="end" class="t small" fill="#6b7280">개념도</text>
  <text x="960" y="92" text-anchor="middle" class="t title">Delay-Doppler 경로가 DAFT bin으로 매핑되는 원리</text>

  <rect x="90" y="165" width="540" height="720" class="box"/>
  <text x="360" y="230" text-anchor="middle" class="t head">물리 채널</text>
  <line x1="175" y1="760" x2="555" y2="760" class="axis"/>
  <line x1="175" y1="760" x2="175" y2="320" class="axis"/>
  <text x="365" y="820" text-anchor="middle" class="t body">Delay l</text>
  <text x="115" y="525" text-anchor="middle" transform="rotate(-90 115 525)" class="t body">Doppler ν</text>
  <g class="grid"><line x1="270" y1="760" x2="270" y2="330"/><line x1="365" y1="760" x2="365" y2="330"/><line x1="460" y1="760" x2="460" y2="330"/><line x1="175" y1="650" x2="555" y2="650"/><line x1="175" y1="540" x2="555" y2="540"/><line x1="175" y1="430" x2="555" y2="430"/></g>
  <circle cx="270" cy="650" r="24" class="blue"/><text x="305" y="645" class="t body">경로 1</text>
  <circle cx="365" cy="475" r="24" class="green"/><text x="400" y="470" class="t body">경로 2</text>
  <circle cx="485" cy="370" r="24" class="purple"/><text x="520" y="365" class="t body">경로 3</text>

  <rect x="720" y="290" width="480" height="390" class="box"/>
  <text x="960" y="365" text-anchor="middle" class="t head">Chirp 변환</text>
  <text x="960" y="455" text-anchor="middle" class="t body">delay가 주파수 이동으로 변환</text>
  <text x="960" y="535" text-anchor="middle" class="t head">Indₚ = (αₚ + 2Nc₁lₚ) mod N</text>
  <text x="960" y="610" text-anchor="middle" class="t body">c₁을 조절해 경로 위치가 겹치지 않게 설계</text>

  <path d="M630 430 C675 430 680 430 720 430" class="arrow blue"/>
  <path d="M630 525 C675 525 680 525 720 525" class="arrow green"/>
  <path d="M630 620 C675 620 680 620 720 620" class="arrow purple"/>

  <rect x="1290" y="165" width="540" height="720" class="box"/>
  <text x="1560" y="230" text-anchor="middle" class="t head">DAFT 영역</text>
  <line x1="1370" y1="700" x2="1755" y2="700" class="axis"/>
  <text x="1560" y="770" text-anchor="middle" class="t body">DAFT bin index</text>
  <g class="grid"><line x1="1405" y1="700" x2="1405" y2="350"/><line x1="1475" y1="700" x2="1475" y2="350"/><line x1="1545" y1="700" x2="1545" y2="350"/><line x1="1615" y1="700" x2="1615" y2="350"/><line x1="1685" y1="700" x2="1685" y2="350"/></g>
  <rect x="1408" y="560" width="58" height="140" rx="8" class="blue"/><text x="1437" y="535" text-anchor="middle" class="t small">경로 1</text>
  <rect x="1548" y="445" width="58" height="255" rx="8" class="green"/><text x="1577" y="420" text-anchor="middle" class="t small">경로 2</text>
  <rect x="1688" y="350" width="58" height="350" rx="8" class="purple"/><text x="1717" y="325" text-anchor="middle" class="t small">경로 3</text>
  <text x="1560" y="835" text-anchor="middle" class="t body">서로 다른 위치에 나타나는 경로</text>

  <rect x="280" y="945" width="1360" height="90" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="960" y="1002" text-anchor="middle" class="t body">경로 분리 → 구조적인 채널 추정 및 검출 → 여러 경로의 diversity 활용</text>
</svg>

